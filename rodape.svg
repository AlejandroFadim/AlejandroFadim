<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-labelledby="t d">
<title id="t">Rodapé</title>
<desc id="d">Linha dourada com a frase: confiança no número vem antes do gráfico bonito.</desc>
<style>
  .t{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .glow{animation:g 4s ease-in-out infinite}
  @keyframes g{0%,100%{opacity:.55}50%{opacity:1}}
</style>

<defs><linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E5B94D" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B94D"/><stop offset="1" stop-color="#E5B94D" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="20" width="1000" height="2" fill="url(#fl)" class="glow"/>
<text class="m" x="500.0" y="62" font-size="14" text-anchor="middle" fill="#9AA4B5" letter-spacing="0.6">confiança no número vem antes do gráfico bonito</text>
</svg>
