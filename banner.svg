<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
<title id="t">Alejandro Castor, Analista de Dados e BI</title>
<desc id="d">Banner com o lema Do dado bruto à decisão e um gráfico de barras com linha de meta.</desc>
<style>
  .t{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .ln{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.6s ease-out .9s both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out 2.4s infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.55}}
  .blink{animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
</style>

<defs>
  <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3D27A"/><stop offset="1" stop-color="#C9962A"/></linearGradient>
  <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D27A"/><stop offset="1" stop-color="#B98A25"/></linearGradient>
  <radialGradient id="glow" cx="0.82" cy="0.38" r="0.55"><stop offset="0" stop-color="#E5B94D" stop-opacity="0.20"/><stop offset="1" stop-color="#E5B94D" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern>
  <clipPath id="clip"><rect width="1000" height="320" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="320" fill="#0A0C10"/>
  <rect width="1000" height="320" fill="url(#grid)"/>
  <rect width="1000" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1000" height="4" fill="url(#gt)"/>
</g>
<rect x="0.5" y="0.5" width="999" height="319" rx="22" fill="none" stroke="#1D2330"/>

<text class="m" x="56" y="88" font-size="13" letter-spacing="3" fill="#E5B94D">ALEJANDRO CASTOR  ·  SÃO PAULO, SP</text>
<text class="t" x="54" y="158" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#F6F8FB">Do dado bruto</text>
<text class="t" x="54" y="220" font-size="56" font-weight="700" letter-spacing="-1.5" fill="url(#gt)">à decisão.</text>
<text class="t" x="56" y="264" font-size="18" fill="#9AA4B5">Analista de Dados e BI, com foco em Engenharia de Dados</text>

<g>
  <rect x="612" y="56" width="336" height="208" rx="16" fill="#12161D" stroke="#1D2330"/>
  <text class="m" x="636" y="90" font-size="12" letter-spacing="1.5" fill="#9AA4B5">nota_execucao</text>
  <circle cx="876" cy="86" r="5" fill="#E5484D"/>
  <circle cx="896" cy="86" r="5" fill="#F5C518"/>
  <circle cx="916" cy="86" r="5" fill="#30A46C" class="blink"/>
  <line x1="634" y1="150.8" x2="926" y2="150.8" stroke="#C08A5E" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text class="m" x="636" y="142.8" font-size="11" fill="#C08A5E">meta</text>
  <line x1="634" y1="231" x2="926" y2="231" stroke="#1D2330"/>
  <rect class="bar" style="animation-delay:0.30s" x="642" y="194.0" width="28" height="36.0" rx="5" fill="url(#gb)" opacity="0.55"/><rect class="bar" style="animation-delay:0.45s" x="686" y="179.6" width="28" height="50.4" rx="5" fill="url(#gb)" opacity="0.62"/><rect class="bar" style="animation-delay:0.60s" x="730" y="186.8" width="28" height="43.2" rx="5" fill="url(#gb)" opacity="0.58"/><rect class="bar" style="animation-delay:0.75s" x="774" y="164.0" width="28" height="66.0" rx="5" fill="url(#gb)" opacity="0.75"/><rect class="bar" style="animation-delay:0.90s" x="818" y="155.6" width="28" height="74.4" rx="5" fill="url(#gb)" opacity="0.85"/><rect class="bar" style="animation-delay:1.05s" x="862" y="160.4" width="28" height="69.6" rx="5" fill="url(#gb)" opacity="0.8"/><rect class="bar" style="animation-delay:1.20s" x="906" y="131.6" width="28" height="98.4" rx="5" fill="url(#gb)" opacity="1.0"/>
  <path class="ln" d="M656.0,180.0 L700.0,162.6 L744.0,166.8 L788.0,141.0 L832.0,129.6 L876.0,131.4 L920.0,99.6" fill="none" stroke="#AEB8C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
  <circle class="pulse" cx="920.0" cy="99.6" r="5" fill="#F3D27A"/>
</g>

</svg>
